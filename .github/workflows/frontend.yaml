name: Ci/Cd pipleline
on:
  push:
    paths:
        - 'frontend/duunitori_front/**'
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/duunitori_front
    
    steps:
    - name: code checkout
      uses: actions/checkout@v3 

    - name: Node.js set up
      uses: actions/setup-node@v3
      with:
        node-version: '20.14.0'

    - name: Install Dependencies

      run: npm install

    - name: Build project
      run: npm run build
